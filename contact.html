<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jun Zhu · Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f; --surface: rgba(255,255,255,0.04); --surface-2: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08); --border-bright: rgba(255,255,255,0.15);
      --text: #f0f0f8; --text-2: #9090b0; --text-3: #5a5a80;
      --accent: #7c6fff; --accent-2: #a78bfa; --accent-glow: rgba(124,111,255,0.3);
      --coral: #ff6b6b; --teal: #4ecdc4;
    }
    [data-theme="light"] { --bg: #f5f3f0; --bg-2: #eeecea; --surface: rgba(0,0,0,0.03); --surface-2: rgba(0,0,0,0.05); --border: rgba(0,0,0,0.07); --border-bright: rgba(0,0,0,0.12); --text: #1a1a2e; --text-2: #4a4a6a; --text-3: #8a8aaa; --card-bg: rgba(255,255,255,0.7); }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Space Grotesk','Noto Serif SC',sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; overflow-x: hidden; }

    #loader { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; transition: opacity 0.6s ease, visibility 0.6s ease; }
    #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-logo { font-family: 'Noto Serif SC', serif; font-size: 28px; font-weight: 700; }
    .loader-bar { width: 120px; height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .loader-bar::after { content: ''; display: block; width: 40%; height: 100%; background: var(--accent); border-radius: 2px; animation: loadSlide 1s ease-in-out infinite; }
    @keyframes loadSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }

    .bg-orbs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.15; animation: orbFloat 20s ease-in-out infinite; }
    .orb-1 { width: 600px; height: 600px; background: var(--accent); top: -200px; left: -200px; animation-delay: 0s; }
    .orb-2 { width: 400px; height: 400px; background: var(--coral); top: 40%; right: -100px; animation-delay: -7s; }
    .orb-3 { width: 500px; height: 500px; background: var(--teal); bottom: -100px; left: 20%; animation-delay: -14s; }
    @keyframes orbFloat { 0%,100% { transform: translate(0,0) scale(1); } 25% { transform: translate(40px,-30px) scale(1.05); } 50% { transform: translate(-20px,20px) scale(0.95); } 75% { transform: translate(30px,10px) scale(1.02); } }

    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 0 40px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
    nav.scrolled { background: rgba(10,10,15,0.85); }
    .nav-inner { max-width: 1160px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 60px; }
    .nav-logo { font-size: 15px; font-weight: 600; letter-spacing: 0.5px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .nav-links { display: flex; align-items: center; gap: 32px; list-style: none; }
    .nav-links a { color: var(--text-3); text-decoration: none; font-size: 13px; font-weight: 500; letter-spacing: 0.3px; transition: color 0.2s; position: relative; }
    .nav-links a::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 1px; background: var(--accent); transition: width 0.3s; }
    .nav-links a:hover { color: var(--text); }
    .nav-links a:hover::after { width: 100%; }
    .nav-links a.active { color: var(--text); }
    .nav-links a.active::after { width: 100%; }
    .nav-actions { display: flex; align-items: center; gap: 12px; }
    .lang-toggle { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; text-decoration: none; transition: all 0.2s; backdrop-filter: blur(8px); }
    .lang-toggle:hover { border-color: var(--accent); color: var(--accent); }
    .theme-toggle { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.3s; }
    .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

    .page { position: relative; z-index: 1; padding: 0 40px; min-height: 100vh; display: flex; align-items: center; }
    .page-inner { max-width: 1160px; margin: 0 auto; width: 100%; display: grid; grid-template-columns: 1fr 420px; gap: 80px; align-items: start; padding: 120px 0 80px; }

    .eyebrow { display: inline-flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--border); color: var(--accent); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 24px; backdrop-filter: blur(10px); }
    .eyebrow-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .page h1 { font-family: 'Noto Serif SC', serif; font-size: clamp(36px, 4vw, 52px); font-weight: 700; line-height: 1.2; letter-spacing: -1px; margin-bottom: 16px; }
    .page h1 .accent-line { background: linear-gradient(135deg, var(--accent), var(--teal)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .lead { font-size: 15px; color: var(--text-2); line-height: 1.8; max-width: 520px; margin-bottom: 0; }

    .contact-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 32px;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    .cc-header { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-3); margin-bottom: 20px; }
    .cc-row { display: flex; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--border); transition: all 0.2s; }
    .cc-row:last-child { border-bottom: none; }
    .cc-row:hover { transform: translateX(4px); }
    .cc-icon { width: 42px; height: 42px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .cc-label { font-size: 11px; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
    .cc-value { font-size: 14px; color: var(--text); font-weight: 500; }
    .cc-value a { color: var(--text); text-decoration: none; transition: color 0.2s; }
    .cc-value a:hover { color: var(--accent); }

    .cc-divider { height: 1px; background: var(--border); margin: 20px 0; }
    .cc-note { font-size: 12px; color: var(--text-3); line-height: 1.7; }

    footer { position: relative; z-index: 1; border-top: 1px solid var(--border); padding: 28px 40px; text-align: center; font-size: 12px; color: var(--text-3); }
    footer a { color: var(--accent); text-decoration: none; }
    footer span { color: var(--teal); font-style: italic; }

    .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }

    @media (max-width: 900px) {
      .page-inner { grid-template-columns: 1fr; gap: 40px; }
      .nav-links { display: none; }
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>
<script>if(localStorage.getItem('theme')==='light')document.documentElement.setAttribute('data-theme','light');</script>

<div id="loader"><div class="loader-logo">朱珺</div><div class="loader-bar"></div></div>
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<nav id="mainNav">
  <div class="nav-inner">
    <div class="nav-logo">朱珺</div>
    <ul class="nav-links">
      <li><a href="index.html">关于我</a></li>
      <li><a href="projects.html">项目经历</a></li>
      <li><a href="research.html">研究兴趣</a></li>
      <li><a href="#" class="active">联系方式</a></li>
    </ul>
    <div class="nav-actions">
      <button class="theme-toggle" id="themeToggle" title="切换主题">☀</button>
      <a href="contact-en.html" class="lang-toggle">🌐 EN</a>
    </div>
  </div>
</nav>

<div class="page">
  <div class="page-inner">
    <div>
      <div class="eyebrow reveal">
        <span class="eyebrow-dot"></span>
        Contact · 联系方式
      </div>
      <h1 class="reveal reveal-delay-1">
        联系<br>
        <span class="accent-line">方式</span>
      </h1>
      <p class="lead reveal reveal-delay-2">
        如果您对我的研究方向感兴趣，或希望探讨合作可能，欢迎通过以下方式联系。我会尽快回复。
      </p>
    </div>

    <div class="contact-card reveal reveal-delay-2">
      <div class="cc-header">Contact Information</div>
      <div class="cc-row">
        <div class="cc-icon">📧</div>
        <div>
          <div class="cc-label">Email</div>
          <div class="cc-value"><a href="mailto:jzhubh@connect.ust.hk">jzhubh@connect.ust.hk</a></div>
        </div>
      </div>
      <div class="cc-row">
        <div class="cc-icon">📱</div>
        <div>
          <div class="cc-label">Phone</div>
          <div class="cc-value">175 1162 8618</div>
        </div>
      </div>
      <div class="cc-divider"></div>
      <div class="cc-note">
        也欢迎通过邮件讨论以下话题：博士申请、CORE研究框架、合作研究、项目管理咨询。
      </div>
    </div>
  </div>
</div>

<footer>
  <p>朱珺 · <span>连接学术训练与职业实践</span> · 2026</p>
</footer>

<script>
  window.addEventListener('load', () => { setTimeout(() => { document.getElementById('loader').classList.add('hidden'); }, 600); });
  window.addEventListener('scroll', () => { document.getElementById('mainNav').classList.toggle('scrolled', window.scrollY > 40); });
  const reveals = document.querySelectorAll('.reveal');
  const obs = new IntersectionObserver((entries) => { entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } }); }, { threshold: 0.08 });
  reveals.forEach(el => obs.observe(el));
  const themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', () => { const isLight = document.documentElement.getAttribute('data-theme') === 'light'; document.documentElement.setAttribute('data-theme', isLight ? '' : 'light'); localStorage.setItem('theme', isLight ? 'dark' : 'light'); themeToggle.textContent = isLight ? '☀' : '🌙'; });
</script>
</body>
</html>
